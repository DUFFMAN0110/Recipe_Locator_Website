<!DOCTYPE html>
<html lang="en"> 

<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content=""width-device-width, initial-scale="1.0">

    <title>Recipe Locator</title>

    <!-- External stylesheet for this page when created -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header containing app name and purpose -->
     <header class ="header">
        <h1>Recipe Locator</h1>
        <p>
            Find recipes by ingredients, recipe names, or meal types.
        </p>
     </header>

     <!-- Main navigation section -->
     <nav class="navigation" aria-label="Main navigation">
        <ul>
            <li>
                <a href="#search">Search Recipes</a>
            </li>
            <li>
                <a href="#recipes">Display Recipes</a>
            </li>
        </ul>
     </nav>

     <!-- Main Content of the Recipe Locator Web Application -->
     <main>
        <section 
            id="search" 
            class="search-section" 
            aria-labelledby="search-heading"
        >
        <header>
            <h2 id="search-heading">Find a Recipe</h2>
            <p>
                Search by recipe name, ingredient, or type of meal.
            </p>
        </header>
    </section>
     </main>
</body>

</html>
