<!DOCTYPE html>
<html lang="en"> 

<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content=""width-device-width, initial-scale="1.0">

    <title>Recipe Locator</title>

    <!-- External stylesheet for this page when created -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header containing app name and purpose -->
     <header class ="header">
        <h1>Recipe Locator</h1>
        <p>
            Find recipes by ingredients, recipe names, or meal types.
        </p>
     </header>

     <!-- Main navigation section -->
     <nav class="navigation" aria-label="Main navigation">
        <ul>
            <li>
                <a href="#search">Search Recipes</a>
            </li>
            <li>
                <a href="#recipes">Display Recipes</a>
            </li>
        </ul>
     </nav>

     <!-- Main Content of the Recipe Locator Web Application -->
     <main>
        <section 
            id="search" 
            class="search-section" 
            aria-labelledby="search-heading"
        >
        <header>
            <h2 id="search-heading">Find a Recipe</h2>
            <p>
                Search by recipe name, ingredient, or type of meal.
            </p>
        </header>

        <!-- Search form, this is where API request will be -->
         <form id="search-form">
            <label for="search-input">
                Recipe or ingredient
            </label>

            <input
                type="search"
                id="search-input"
                name="search"
                placeholder="e.g. chicken. pasta, tacos..."
                autocomplete="off"
                required
                >

                <button type="submit" id="search-button">
                    Search
                </button>
                
         </form>

         <!-- Status Area -->
          <p id="search-status"
          class="search-status"
          aria-live="polite"></p>
          
    </section>
    <!-- Recipe Results Section -->
     <section id="recipes" class="results-section" aria-labelledby="results-heading">
        <header>
            <h2 id="results-heading">Recipe Results</h2>
        </header>

        <!-- Message shown before a search is performed -->
        <p class="empty-message">
            Search for a recipe or ingredient to get started!
        </p>
     </section>

     <!-- Recipe Details Section -->
      <section id="recipe-details" class="recipe-details" aria-labelledby="details-heading" hidden>
        <header>
            <h2 id="details-heading">Recipe Details</h2>
        </header>

        <button 
            type="button"
            id="close-details"
            class="close-button"
            aria-label="Close recipe details"
            >Close</button>

      </section>
     </main>
</body>

</html>
